<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="academicShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="academicVermilionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D2E" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="academicGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="academicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Badge -->
  <rect x="14" y="14" width="172" height="172" rx="48" fill="url(#academicShieldGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" />

  <!-- Stylized Cambridge Academic Folio -->
  <!-- Left Page -->
  <path d="M 46 118 C 62 110 82 110 96 120 L 96 68 C 82 58 62 58 46 68 Z" fill="rgba(255, 255, 255, 0.9)" />
  <!-- Right Page -->
  <path d="M 154 118 C 138 110 118 110 104 120 L 104 68 C 118 58 138 58 154 68 Z" fill="#FFFFFF" />
  <!-- Spine -->
  <line x1="100" y1="66" x2="100" y2="122" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />

  <!-- Precision Pen Nib in Vermilion & Gold -->
  <path d="M 100 38 L 115 68 L 85 68 Z" fill="url(#academicVermilionGrad)" filter="url(#academicGlow)" />
  <circle cx="100" cy="56" r="3.5" fill="#F8FAFC" />
  <line x1="100" y1="38" x2="100" y2="52" stroke="#F8FAFC" stroke-width="3" />

  <!-- Foundation Golden Arc -->
  <path d="M 54 142 C 72 136 128 136 146 142" stroke="url(#academicGoldGrad)" stroke-width="8" stroke-linecap="round" />
</svg>